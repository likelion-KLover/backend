input {
  rabbitmq {
    host => "localhost"
    port => 5672
    queue => "ES_TOURPOST_UPDATE"
    user => "admin"
    password => "admin"
    codec => json
  }
}
filter {
    if [mapx] and [mapy]{
      mutate {
        convert => {"%{mapy}" => "float"}
        convert => {"%{mapx}" => "float"}
      }
      mutate {
        add_field => { "[location][lat]" => "%{mapy}" }
        add_field => { "[location][lon]" => "%{mapx}" }
      }
      mutate {
        remove_field => ["mapx", "mapy"]
      }
      mutate {
        convert => {"[location][lat]" => "float"}
        convert => {"[location][lon]" => "float"}
      }
      ruby {
         code => "event.set('[location]', { 'lat' => event.get('[location][lat]'), 'lon' => event.get('[location][lon]') })"
      }
    }
}
output {
    if [language] == "KO"{
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "tourpostkor"
            action => "update"
            document_id => "%{content_id}"
        }
    }
    if [language] == "EN"{
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "tourpostkor"
            action => "update"
            document_id => "%{content_id}"
        }
    }
    if [language] == "JA"{
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "tourpostkor"
            action => "update"
            document_id => "%{content_id}"
        }
    }
    if [language] == "ZH"{
        elasticsearch {
            hosts => ["elasticsearch:9200"]
            index => "tourpostkor"
            action => "update"
            document_id => "%{content_id}"
        }
    }
}