      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://admin:admin@43.203.244.12:27017/meta_db?authSource=admin
      database: meta_db
  rabbitmq:
    host: 13.125.235.125
    port: 5672
    username: admin
    password: admin

# Swagger 비활성화 (운영 환경에서는 보통 사용 안 함)
