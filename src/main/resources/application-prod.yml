spring:
  datasource:
    url: jdbc:postgresql://43.203.244.12:5432/meta_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false      # 운영 환경에서는 보통 false로 설정
